apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-app
  labels:
    app: staging-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: staging-app
  template:
    metadata:
      labels:
        app: staging-app
    spec:
      containers:
      - name: staging-app
        image: quay.apps.cluster-x8cz4.dyn.redhatworkshops.io/workshop/staging-app:v1
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
